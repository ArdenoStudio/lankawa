name: Ingest

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ingest/requirements.txt

      - name: Run ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BOT_CONTACT_URL: https://github.com/ArdenoStudio/lankawa
        run: python -m ingest.run

      - name: Trigger Vercel cron (optional)
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEPLOY_URL: https://lankawa.vercel.app
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl -sf -H "Authorization: Bearer $CRON_SECRET" "$DEPLOY_URL/api/cron/ingest"
          else
            echo "CRON_SECRET not set — skipping Vercel cron trigger"
          fi

      - name: Notify ops Telegram on failure
        if: failure()
        env:
          TELEGRAM_OPS_BOT_TOKEN: ${{ secrets.TELEGRAM_OPS_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_OPS_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_OPS_CHAT_ID:-}" ]; then
            echo "TELEGRAM_OPS_* secrets not configured on this repo - skipping notification"
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          text=$(printf '[Lankawa ops] Daily ingest FAILED\nrun: %s\nObservations will be missing from pulse history until the next success.' "$run_url")
          payload=$(jq -n --arg chat "$TELEGRAM_OPS_CHAT_ID" --arg text "$text" \
            '{chat_id: $chat, text: $text, disable_web_page_preview: true}')
          curl -sfS --max-time 30 \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.telegram.org/bot${TELEGRAM_OPS_BOT_TOKEN}/sendMessage" \
            || echo "Telegram notification failed (non-blocking)"
